[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skysim"
version = "1.0.0"
description = "Point-mass airspace simulator with an HTTP API: flight, ballistics and balloons, surface to 60 km, 32 objects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
skysim = "skysim.__main__:main"

[tool.setuptools]
packages = ["skysim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
